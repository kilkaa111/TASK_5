<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рога и Копыта — интернет-магазин</title>
    <!-- Подсказка: Стили добавляются здесь -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>🦌 Рога и Копыта</h1>
        <p>Всё для офиса — с доставкой в любой город</p>
    </header>

    <main>
        <!-- Каталог товаров -->
        <section class="catalog">
            <h2>Каталог</h2>

            <div class="filters">
                <select id="category">
                    <option value="">Все категории</option>
                    <!-- остальные категории добавит app.js -->
                </select>
                <input id="search" type="text" placeholder="Поиск по названию">
            </div>

            <!-- Сюда app.js положит карточки товаров -->
            <div id="products" class="products"></div>
        </section>

        <!-- Корзина -->
        <aside class="cart">
            <h2>Корзина</h2>

            <ul id="cart"></ul>
            <p id="total" class="total"></p>

            <select id="client">
                <option value="">— выбери клиента —</option>
                <!-- клиентов добавит app.js -->
            </select>
            <button id="order-button">Оформить заказ</button>

            <p id="message" class="message"></p>
        </aside>
    </main>

    <!-- Сначала api.js (функции для общения с API), потом app.js, который ими пользуется -->
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
